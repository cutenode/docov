# `cargo coverage`: the tests under cargo-llvm-cov, failing below full coverage of lines, functions
# and regions. Test modules live in their own `tests.rs` files, which cargo-llvm-cov leaves out by
# default. `cargo coverage --test props` is the Hegel properties alone, held to the same thresholds.
# Run both with HEGEL_DERANDOMIZE=true, as tools/coverage.sh does, so Hegel draws the same cases every
# run and the numbers don't move. The report lists any uncovered lines, so a failure on CI says where.
[alias]
coverage = "llvm-cov nextest --no-fail-fast --show-missing-lines --fail-under-lines 100 --fail-under-functions 100 --fail-under-regions 100"
