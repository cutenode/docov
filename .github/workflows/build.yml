name: Build

# The release binaries. release.yml calls this on a release tag and packs what it uploads.
# scheduled.yml calls it weekly, so a target that stops building in the release profile shows up
# before the next release rather than on its tag. tools/lint.sh reads the targets from here.
on:
  workflow_call:
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  # A docov binary for each npm platform package, named for Node's process.platform and
  # process.arch. The Linux ones link musl statically, so they run whatever a distro's glibc is.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: darwin-arm64, target: aarch64-apple-darwin, os: macos-latest }
          - { platform: darwin-x64, target: x86_64-apple-darwin, os: macos-latest }
          - { platform: linux-arm64, target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { platform: linux-x64, target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { platform: win32-arm64, target: aarch64-pc-windows-msvc, os: windows-latest }
          - { platform: win32-x64, target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install && rustup target add "$TARGET"
      - run: cargo build --release --locked --target "$TARGET"
        env:
          # Links the MSVC runtime in, so the Windows binaries run without it installed.
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
      # A weekly run's binaries are only checked for, so they're kept a day rather than the
      # repository's default.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.platform }}
          path: target/${{ matrix.target }}/release/docov${{ startsWith(matrix.platform, 'win32') && '.exe' || '' }}
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'schedule' && 1 || 0 }}
