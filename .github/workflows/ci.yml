name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels its older run. Each push to main runs to the end, so every
# commit there gets a result and saves the caches pull requests start from.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Each runs on Linux, macOS, and Windows, whose paths use the other separator, and shows on a pull
  # request as its own pass/fail check.
  lint:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      # Only main saves caches. A pull request's cache is only readable by that pull request, and
      # each one's crowded main's out of the repository's 10 GB.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The linters tools/lint.sh runs where they're installed, needed once rather than per OS.
      - if: runner.os == 'Linux'
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny,zizmor
      # install-action doesn't carry actionlint. go install checks it against Go's checksum database.
      - if: runner.os == 'Linux'
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: tools/lint.sh
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}

  coverage:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest,cargo-llvm-cov
      - run: tools/coverage.sh
        shell: bash
        env:
          LCOV_DIR: coverage
      # macos-latest's .NET isn't in the default folder, the only place besides DOTNET_ROOT that
      # ReportGenerator's launcher looks. The dotnet command resolves its symlink to find it, so this
      # does the same.
      - if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: echo "DOTNET_ROOT=$(dirname "$(realpath "$(command -v dotnet)")")" >> "$GITHUB_ENV"
      # Each coverage run's per-file table in the job summary. A run under its thresholds still
      # writes its lcov, so this shows where it fell short.
      - uses: danielpalme/ReportGenerator-GitHub-Action@861674232075b2c6bd1405a04c4bb9b150653e81 # 5.5.12
        if: ${{ !cancelled() && hashFiles('coverage/suite.lcov') != '' }}
        with:
          reports: coverage/suite.lcov
          targetdir: coverage/suite
          reporttypes: MarkdownSummaryGithub
          title: Coverage, whole suite (${{ matrix.os }})
      - uses: danielpalme/ReportGenerator-GitHub-Action@861674232075b2c6bd1405a04c4bb9b150653e81 # 5.5.12
        if: ${{ !cancelled() && hashFiles('coverage/props.lcov') != '' }}
        with:
          reports: coverage/props.lcov
          targetdir: coverage/props
          reporttypes: MarkdownSummaryGithub
          title: Coverage, Hegel properties (${{ matrix.os }})
      - if: ${{ !cancelled() && hashFiles('coverage/*/SummaryGithub.md') != '' }}
        run: cat coverage/*/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
        shell: bash
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage-${{ matrix.os }}
          path: coverage/*.lcov
          if-no-files-found: ignore

  # The GitHub Action (action.yml) on a small documented module, running this commit's docov through
  # DOCOV_BINARY, since the published one may not have the flags it passes yet. Linux only: the
  # action's script is the same everywhere.
  action:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --locked
      # The module's report, then a second export.
      - run: |
          mkdir fixture
          printf '/** a */\nexport const a = 1;\n' > fixture/a.ts
          target/debug/docov fixture --format json=base.json
          printf '/** b */\nexport const b = 2;\n' >> fixture/a.ts
      - id: docov
        uses: ./
        with:
          args: fixture
          compare: base.json
        env:
          DOCOV_BINARY: ${{ github.workspace }}/target/debug/docov
      - run: grep -F "| 100.0% | 100.0% | +0.0 | 2/2 |" "$MARKDOWN"
        env:
          MARKDOWN: ${{ steps.docov.outputs.markdown }}

  # What `cargo install docov` and crates.io get: the packaged crate, which leaves out Cargo.toml's
  # `exclude`, built with the oldest Rust Cargo.toml's `rust-version` claims.
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          rustup toolchain install "$msrv" --profile minimal
          cargo "+$msrv" package --locked

  # The one check for branch protection to require, failing when any job above failed or was
  # cancelled, so adding or renaming a job doesn't change what's required. It always runs: branch
  # protection takes a skipped check as a pass.
  ci:
    if: ${{ always() }}
    needs: [lint, coverage, action, msrv]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
