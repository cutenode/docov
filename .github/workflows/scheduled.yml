name: Scheduled

# Checks whose results change without a commit here, or that take too long for every pull request,
# weekly and on demand. build.yml builds the release binaries on the same schedule.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # New advisories for Cargo.lock and package-lock.json, and zizmor's online audits (impostor
  # commits, known-vulnerable actions), which pull requests leave out.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-deny@0.20.2,zizmor@1.31.1
      - run: cargo deny --locked check advisories
      - run: zizmor .
        env:
          GH_TOKEN: ${{ github.token }}
      # package.json's devEngines wants a newer npm than the runners' own Node has.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm audit

  # The Hegel properties with random cases, each run several times. Pull requests run them
  # derandomized, drawing the same cases every time. A failure's examples are in the hegel artifact,
  # and copying them to .hegel/ replays them first in the next local run.
  props:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-nextest@0.9.149
      - run: cargo nextest run --locked --test props --no-fail-fast --stress-count 5
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: hegel
          path: .hegel/
          include-hidden-files: true
          if-no-files-found: ignore
