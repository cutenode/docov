name: Dependency review

# The dependencies a pull request adds or updates, in the lockfiles, manifests and workflows, from
# GitHub's dependency graph. cargo-deny (deny.toml) already checks the crates' licences and
# advisories, and the npm packages are dev tooling that nothing ships. What's left is mostly the
# licences of the actions the workflows use, and advisories for those actions.
#
# Its own workflow, since it only reviews pull requests. It isn't a required check, so it can
# filter on paths in its trigger: a pull request that changes none of the files the dependency
# graph reads starts no runner. Those are the lockfiles and manifests (Cargo.lock and Cargo.toml,
# package-lock.json and package.json) and the workflows, which only count as manifests in
# .github/workflows/. action.yml uses no other actions, so it has nothing to review.
on:
  # Not `reopened`: a reopened pull request has the same changes it was reviewed on.
  pull_request:
    types: [opened, synchronize, ready_for_review]
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "package-lock.json"
      - "**/package.json"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Dependency review
    # A draft waits until it's ready for review. Nothing requires this check, so the event's draft
    # state is enough: ready_for_review starts the run that reviews it.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # The summary comment, posted only when the review fails. Pull requests from forks get a
      # read-only token, and the action logs a warning in place of the comment.
      pull-requests: write
    steps:
      # Reads the base and head commits through the API, so there's no checkout.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # An advisory of any severity fails, in what ships (the runtime scope) and not the dev
          # tooling. The licences below are checked in the same scope.
          fail-on-severity: low
          fail-on-scopes: runtime
          # The same list as [licenses] allow in deny.toml, so crates and actions follow one
          # policy. Keep the two in step.
          allow-licenses: >-
            Apache-2.0,
            Apache-2.0 WITH LLVM-exception,
            BSL-1.0,
            CC0-1.0,
            ISC,
            MIT,
            MIT-0,
            Unicode-3.0,
            Unlicense,
            Zlib
          # rust-cache is LGPL-3.0. It runs in CI and nothing it contains ships with docov.
          allow-dependencies-licenses: >-
            pkg:githubactions/Swatinem/rust-cache
          comment-summary-in-pr: on-failure
