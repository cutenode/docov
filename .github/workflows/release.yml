name: Release

# Pushing a version tag (v1.2.3, matching Cargo.toml) publishes docov to crates.io and npm with
# trusted publishing, so neither registry needs a token here. Run by hand, it builds and packs
# everything without publishing. tools/bootstrap-publishing.sh publishes the first version from
# such a run, since neither registry trusts a workflow with a package it doesn't have yet.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

defaults:
  run:
    shell: bash

jobs:
  # A docov binary for each npm platform package, named for Node's process.platform and
  # process.arch. The Linux ones link musl statically, so they run whatever a distro's glibc is.
  build:
    strategy:
      matrix:
        include:
          - { platform: darwin-arm64, target: aarch64-apple-darwin, os: macos-latest }
          - { platform: darwin-x64, target: x86_64-apple-darwin, os: macos-latest }
          - { platform: linux-arm64, target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { platform: linux-x64, target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { platform: win32-arm64, target: aarch64-pc-windows-msvc, os: windows-latest }
          - { platform: win32-x64, target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install && rustup target add "$TARGET"
      - run: cargo build --release --locked --target "$TARGET"
        env:
          # Links the MSVC runtime in, so the Windows binaries run without it installed.
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.platform }}
          path: target/${{ matrix.target }}/release/docov${{ startsWith(matrix.platform, 'win32') && '.exe' || '' }}
          if-no-files-found: error

  crates:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - name: Check the tag is Cargo.toml's version
        if: github.event_name == 'push'
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [[ $GITHUB_REF_NAME != "v$version" ]]; then
            echo "::error::$GITHUB_REF_NAME doesn't match Cargo.toml's version, $version"
            exit 1
          fi
      - if: github.event_name != 'push'
        run: cargo publish --locked --dry-run
      - if: github.event_name == 'push'
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - if: github.event_name == 'push'
        run: tools/cargo-publish.sh
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # After crates, so a tag that fails there publishes nothing to npm either.
  npm:
    needs: crates
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # tools/npm-pack.sh reads the version with cargo.
      - run: rustup toolchain install
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: bins
      - run: tools/npm-pack.sh bins npm-packages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-packages
          path: npm-packages
          if-no-files-found: error
      - if: github.event_name == 'push'
        run: tools/npm-publish.sh npm-packages
