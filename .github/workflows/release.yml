name: Release

# uppt (https://github.com/danielroe/uppt) runs releases. Each push to main opens or updates a draft
# release PR from the conventional commits since the last tag, bumping npm/docov/package.json, and
# cargo-pr bumps the rest on it to match. Merging the PR tags it and dispatches this workflow on
# the tag, which builds the binaries, then stages the npm packages (tools/npm-approve.sh approves
# them) and publishes the crate alongside. Both registries use trusted publishing, so there are no
# tokens here. tools/bootstrap-publishing.sh sets that up.
on:
  push:
    # release/v* picks up hand edits to an open release PR
    branches: [main, "release/v*"]
  pull_request:
    types: [closed]
    branches: [main]
  # merged release PRs, publish reruns, and prereleases all arrive here
  workflow_dispatch:
    inputs:
      prerelease:
        description: Cut a prerelease instead of a normal release, e.g. `beta`, `rc`, or `0`
        required: false
        default: ""
      npm-tag:
        description: npm dist-tag to publish to. Set by uppt/release for maintenance lines; leave blank otherwise
        required: false
        default: ""

permissions: {}

# Back-to-back pushes to main would otherwise race their pr and cargo-pr jobs on the release PR's
# branch. Runs for the same event and ref wait their turn, the newest replacing any still waiting.
concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # open or update a draft release PR from conventional commits
  pr:
    if: |
      !github.event.repository.fork
      && (
        (
          github.event_name == 'push'
          && (
            github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
            || startsWith(github.ref, 'refs/heads/release/v')
          )
        ) || (
          github.event_name == 'workflow_dispatch'
          && !startsWith(github.ref, 'refs/tags/')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: danielroe/uppt/pr@6c1a9b480b0f02a3f535dedaf1a113f590aa56f2 # v0.6.12
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: ${{ inputs.prerelease }}
          title: "chore(release): v{version}"
          # npm/platforms only exists while pack runs: tools/npm-platforms.sh writes it.
          packages: &packages |
            npm/docov
            npm/platforms/*

  # uppt/pr only bumps package.json, so this brings Cargo.toml, the pre-commit hook and the
  # README's $schema URL along on the release PR
  cargo-pr:
    needs: pr
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - run: rustup toolchain install
      - run: tools/release-pr-cargo.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # uppt/pr lists a commit that reached main under two hashes twice, and has no setting for it
  changelog-pr:
    needs: pr
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: tools/release-pr-changelog.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # release PR merged: tag it, cut a GitHub release, dispatch the publish run
  release:
    if: |
      github.event_name == 'pull_request'
      && github.event.pull_request.merged == true
      && startsWith(github.event.pull_request.head.ref, 'release/v')
      && github.event.pull_request.head.repo.full_name == github.repository
      && !github.event.repository.fork
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    steps:
      - uses: danielroe/uppt/release@6c1a9b480b0f02a3f535dedaf1a113f590aa56f2 # v0.6.12
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          packages: *packages

  # The binaries, from build.yml, which also runs weekly so a target that stops building shows up
  # before a release.
  build:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  # the npm tarballs: @docov/cli and a platform package per binary
  pack:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: pack-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
    outputs:
      files: ${{ steps.pack.outputs.files }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: bins
      - run: tools/npm-platforms.sh bins
      # The packages have no dependencies to install.
      - id: pack
        uses: danielroe/uppt/pack@6c1a9b480b0f02a3f535dedaf1a113f590aa56f2 # v0.6.12
        with:
          checkout: false
          install: false
          packages: *packages

  # stage the tarballs on npm via OIDC
  publish:
    if: needs.pack.outputs.files != '[]'
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      id-token: write
    environment: npm
    steps:
      - uses: danielroe/uppt/publish@6c1a9b480b0f02a3f535dedaf1a113f590aa56f2 # v0.6.12
        with:
          files: ${{ needs.pack.outputs.files }}
          npm-tag: ${{ inputs.npm-tag }}

  # publish the crate via OIDC, alongside pack and publish. It needs build so that a tag whose
  # binaries don't build publishes nowhere.
  cargo-publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: cargo-publish-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    environment: crates-io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - name: Check the tag is Cargo.toml's version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [[ $GITHUB_REF_NAME != "v$version" ]]; then
            echo "::error::$GITHUB_REF_NAME doesn't match Cargo.toml's version, $version"
            exit 1
          fi
      - id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - run: tools/cargo-publish.sh
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
