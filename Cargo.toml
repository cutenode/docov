[package]
name = "docov"
version = "0.1.1"
edition = "2024"
# oxc's own minimum.
rust-version = "1.97"
description = "JSDoc coverage for JavaScript and TypeScript"
license = "MIT"
readme = "README.md"
repository = "https://github.com/cutenode/docov"
keywords = ["jsdoc", "coverage", "documentation", "javascript", "typescript"]
categories = ["command-line-utilities", "development-tools"]
# The npm package, which only runs the binary.
exclude = ["/npm"]

[lints.rust]
missing_docs = "warn"

[lints.clippy]
cargo_common_metadata = "warn"

[dependencies]
# Colors the text report, stripping the colors where they don't belong. clap uses both already.
anstream = "1.0.0"
anstyle = "1.0.14"
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
# Matches workspace globs (`packages/*`) against folders, for --by-package.
globset = "0.4.21"
# Walks the paths the way ripgrep does: .gitignore, hidden files and the exclude globs.
ignore = "0.4.34"
# Blanks docov.json's comments and trailing commas, so serde_json reads it with its error positions
# unchanged. oxc's own config loading does the same.
json-strip-comments = "3.1.2"
# The parser and its AST. oxc is 0.x and breaks its API between minor versions, so these move
# together and on purpose.
oxc_allocator = "0.156.0"
oxc_ast = "0.156.0"
oxc_parser = "0.156.0"
oxc_span = "0.156.0"
rayon = "1.12.0"
# jsdoc.json's includePattern and excludePattern.
regex = "1.13.1"
rustc-hash = "2.1.3"
# docov.json's JSON Schema (`docov --print-schema`, checked in as docov.schema.json).
schemars = { version = "1.2.3", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
# Reads pnpm-workspace.yaml.
yaml-rust2 = { version = "0.13.0", default-features = false }

[dev-dependencies]
# Property-based tests. Pinned: Hegel is in beta and makes breaking changes. `static-engine`
# links its engine as an ordinary dependency, so it's in Cargo.lock.
hegeltest = { version = "=0.50.4", features = ["static-engine"] }
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
