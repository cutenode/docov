# cargo-deny (tools/lint.sh): security advisories, licenses docov's MIT binaries can ship, and
# crates only from crates.io.

[advisories]
# Unmaintained crates only fail when docov depends on them directly; a transitive one is its
# dependent's to replace.
unmaintained = "workspace"

[licenses]
# Permissive licenses only. Crates offering a GPL or LGPL choice (self_cell, r-efi) are taken under
# their permissive one.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
# Dependencies pull in more than one version of bitflags and hashbrown, which docov can't settle.
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
