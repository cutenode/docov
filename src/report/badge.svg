<svg xmlns="http://www.w3.org/2000/svg" width="{width}" height="20" role="img" aria-label="docs: {message}">
  <title>docs: {message}</title>
  <linearGradient id="shine" x2="0" y2="100%">
    <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
    <stop offset="1" stop-opacity=".1"/>
  </linearGradient>
  <clipPath id="round">
    <rect width="{width}" height="20" rx="3" fill="#fff"/>
  </clipPath>
  <g clip-path="url(#round)">
    <rect width="37" height="20" fill="#555"/>
    <rect x="37" width="{value_width}" height="20" fill="{color}"/>
    <rect width="{width}" height="20" fill="url(#shine)"/>
  </g>
  <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11">
    <text x="18.5" y="15" fill="#010101" fill-opacity=".3">docs</text>
    <text x="18.5" y="14">docs</text>
    <text x="{value_x}" y="15" fill="#010101" fill-opacity=".3">{message}</text>
    <text x="{value_x}" y="14">{message}</text>
  </g>
</svg>
